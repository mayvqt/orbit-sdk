[package]
name = "orbit-cli"
version = "0.1.0"
description = "Seller command-line tool for Orbit licences and releases"
repository = "https://github.com/mayvqt/orbit-sdk"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[[bin]]
name = "orbit"
path = "src/main.rs"

[features]
default = []
# Explicit loopback-only development transport. TLS verification is never disabled.
local-development = []

[dependencies]
aws-lc-rs = "1.18.1"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt"] }

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "deny"
