[package]
name = "orbit-licensed-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[dependencies]
orbit-sdk = { path = "../../../sdk/rust" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }

[features]
default = []
local-development = ["orbit-sdk/local-development"]

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "deny"
