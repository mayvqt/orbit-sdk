[package]
name = "orbit-licensed-export"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[dependencies]
orbit-sdk = { path = "../../../sdk/rust" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
local-development = ["orbit-sdk/local-development"]

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "deny"
