[platformio]
src_dir = .
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
extra_scripts = build_orbit.py
; Keep 24 KiB available for TLS; oversized responses fail with a resource limit.
build_flags = -I../../../sdk/embedded/include -I../common -DORBIT_CLIENT_ARENA_BYTES=8192
