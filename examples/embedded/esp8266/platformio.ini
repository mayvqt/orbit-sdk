[platformio]
src_dir = .
build_dir = ../../../build/embedded-targets/esp8266/compact
[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
extra_scripts = build_orbit.py
; Keep 24 KiB available for TLS; oversized responses fail with a resource limit.
build_flags = -I../../../sdk/embedded/include -I../common -DORBIT_CLIENT_ARENA_BYTES=8192 -DORBIT_APP_KEY=\"${sysenv.ORBIT_APP_KEY}\"

[env:offline_compact]
extends = env:nodemcuv2
build_flags = ${env:nodemcuv2.build_flags} -DORBIT_ENABLE_OFFLINE=1 -DORBIT_OFFLINE_PROFILE_FILE_BYTES=4096

[env:offline_full]
extends = env:nodemcuv2
build_flags = -I../../../sdk/embedded/include -I../common -DORBIT_CLIENT_ARENA_BYTES=16384 -DORBIT_ENABLE_OFFLINE=1 -DORBIT_OFFLINE_PROFILE_FILE_BYTES=16384 -DORBIT_APP_KEY=\"${sysenv.ORBIT_APP_KEY}\"
