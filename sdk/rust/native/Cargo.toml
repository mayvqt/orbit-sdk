[package]
name = "orbit-sdk-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "deny"
