[package]
name = "orbit-sdk-ffi"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
orbit-sdk = { path = "../rust", version = "=0.1.0" }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "net", "time", "sync"] }
